[project]
name = "kbeauty-tariff-agent"
version = "0.0.0"
description = "관세 변화 대응 K-뷰티 수출 의사결정 에이전트: 규정 RAG + 수입통계 SQL + 독립 검증 멀티 에이전트, 사전 등록 평가"
requires-python = ">=3.12,<3.14"
# Dependencies are added (and uv.lock created) when each stage is implemented, after approval of downloads.
# Planned: duckdb, dbt-core, dbt-duckdb, pandas, pyarrow, numpy, rank-bm25 (or DuckDB FTS), openai,
#          langgraph, fastapi, uvicorn, qdrant-client, scipy.
dependencies = []

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
