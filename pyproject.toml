[project]
name = "kbeauty-tariff-agent"
version = "0.0.0"
description = "관세 변화 대응 K-뷰티 수출 의사결정 에이전트: 규정 RAG + 수입통계 SQL + 독립 검증 멀티 에이전트, 사전 등록 평가"
requires-python = ">=3.12,<3.14"
# Dependencies are added (and uv.lock created) when each stage is implemented, after approval of downloads.
# Planned: duckdb, dbt-core, dbt-duckdb, pandas, pyarrow, numpy, rank-bm25 (or DuckDB FTS), openai,
#          langgraph, fastapi, uvicorn, qdrant-client, scipy.
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==2.0.0",
    "pypdf==6.1.1",
]

[dependency-groups]
dev = [
    "pillow==13.0.0",
    "pypdfium2==5.14.0",
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
# Development loop: uv run pytest -m "not slow"   Full verification (CI): uv run pytest
markers = ["slow: rebuilds the dbt warehouse once per case (mutation / negative tests, several minutes)"]
